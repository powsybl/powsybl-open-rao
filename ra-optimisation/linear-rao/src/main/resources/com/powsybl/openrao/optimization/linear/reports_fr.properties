# Keys must be alphabetically ordered
openrao.searchtreerao.reportCostOf = Coût ${costName} de ${cost}
openrao.searchtreerao.reportLinearOptimFoundBetterSolution = Itération ${iteration} : meilleure solution trouvée avec un coût de ${cost} (fonctionnel : ${functionalCost})
openrao.searchtreerao.reportLinearOptimFoundWorseResult = Itération ${iteration} : l'optimisation linéaire a trouvé un résultat moins bon que la meilleure itération, avec un coût passant de ${bestResultCost} à ${currentResultCost} (fonctionnel : de ${bestResultFunctionalCost} à ${currentResultFunctionalCost})
openrao.searchtreerao.reportLinearOptimInitialResult = Optimisation linéaire globale — coût initial de ${cost} (fonctionnel : ${functionalCost})
openrao.searchtreerao.reportLinearOptimizationFailedAtIteration = L'optimisation linéaire a échoué à l'itération ${iteration}
openrao.searchtreerao.reportLinearProblemFailedWithStatus = Le problème linéaire a échoué avec le statut suivant : ${status}, la situation initiale est conservée.
openrao.searchtreerao.reportLinearRaoActivatedRangeAction = [LINEAR RAO] Parades de plage activées : ${variations}
openrao.searchtreerao.reportLinearRaoFinalResult = [LINEAR RAO] Résultat final : coût = ${cost} (fonctionnel : ${functionalCost}, virtuel : ${virtualCost}${virtualCostDetail})
openrao.searchtreerao.reportLinearRaoForcedNetworkActions = [LINEAR RAO] ${nbNetworkActions} parade(s) topologique(s) appliquée(s) avant l'analyse de sensibilité initiale : ${networkActionIds}
openrao.searchtreerao.reportLinearRaoGlobalOptimization = [LINEAR RAO] Optimisation linéaire globale de toutes les parades de plage
openrao.searchtreerao.reportLinearRaoInitialSensitivityAnalysisResults = [LINEAR RAO] Analyse de sensibilité initiale : coût = ${cost} (fonctionnel : ${functionalCost}, virtuel : ${virtualCost}${virtualCostDetail})
openrao.searchtreerao.reportLinearRaoNetworkActionsIgnored = [LINEAR RAO] Le CRAC contient ${nbNetworkActions} parade(s) topologique(s) qui ne seront pas prises en compte : seules les parades de plage sont optimisées
openrao.searchtreerao.reportSameResultAsPreviousIterations = Itération ${iteration} : mêmes résultats que lors des itérations précédentes, solution optimale trouvée
openrao.searchtreerao.reportSolverInterrupted = Le solutionneur a été interrompu. Une solution réalisable a été produite.
openrao.searchtreerao.reportSystematicSensitivityComputationFailedAtIteration = L'analyse de sensibilité systématique a échoué à l'itération ${iteration}
