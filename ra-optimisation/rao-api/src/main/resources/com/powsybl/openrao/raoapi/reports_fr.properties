# Keys must be alphabetically ordered
openrao.raoapi.reportCappingRelativeMinimumImpactThreshold = La valeur ${relativeMinImpactThreshold} fournie pour le paramètre relative-minimum-impact-threshold est supérieure à 1. Elle sera ramenée à 1.
openrao.raoapi.reportNegativeMaxNumberOfBoundariesForSkippingActions = La valeur ${maxNumberOfBoundariesForSkippingActions} fournie pour le paramètre max-number-of-boundaries-for-skipping-actions est inférieure à 0. Elle sera ramenée à 0.
openrao.raoapi.reportNegativeMinimumObjectiveImprovement = La valeur ${curativeRaoMinObjImprovement} fournie pour le paramètre curative-min-obj-improvement est inférieure à 0. Elle sera remplacée par + ${positiveCurativeRaoMinObjImprovement}
openrao.raoapi.reportNegativeRelativeMinimumImpactThreshold = La valeur ${relativeMinImpactThreshold} fournie pour le paramètre relative-minimum-impact-threshold est inférieure à 0. Elle sera ramenée à 0.
openrao.raoapi.reportNegativeSensitivityFailureOvercost = La valeur ${sensitivityFailureOvercost} pour `sensitivity-failure-overcost` est inférieure à 0. Cela encouragerait l'optimiseur à faire diverger le calcul de charge. Elle sera donc remplacée par + ${positiveSensitivityFailureOvercost}
openrao.raoapi.reportRaoVersionAndGitCommit = Exécution du RAO avec Open RAO version ${openRaoVersion} issu du commit git ${gitCommit}.
