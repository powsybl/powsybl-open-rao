name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches-ignore:
      - 'ci/**-**'

jobs:
  build:
    name: Build and test on ${{ matrix.os }} with ${{ matrix.jvm }}
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.head.repo.fork == false
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        jvm: [ java, graalvm ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 21
        if: matrix.jvm == 'java'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup GraalVM
        if: matrix.jvm == 'graalvm'
        uses: graalvm/setup-graalvm@60c26726de13f8b90771df4bc1641a52a3159994 # v1.5.2
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Maven
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        run: mvn --batch-mode -Pjacoco install

      - name: Build with Maven
        if: matrix.os != 'ubuntu-latest' || matrix.jvm != 'java'
        run: mvn --batch-mode install

      - name: Run SonarCloud analysis
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        run: >
          mvn --batch-mode -DskipTests sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=powsybl-ci-github
          -Dsonar.projectKey=com.powsybl:open-rao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  javadoc:
    name: Build Javadoc
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Javadoc with Maven
        run: mvn --batch-mode -Prelease -DskipTests -Dcheckstyle.skip package
