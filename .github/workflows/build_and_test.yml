name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches-ignore:
      - 'ci/**-**'

jobs:
  path-filter:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/path-filter.yml

  build:
    needs: path-filter
    name: Build and test on ${{ matrix.os }} with ${{ matrix.jvm }}
    runs-on: ${{ matrix.os }}
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork == false)
    # Docs-only PRs: skip all build cells except ubuntu/java, which still runs so that the
    # SonarCloud analysis (and its quality-gate check) executes and reports the real result.
    # If the path-filter job FAILS, treat it as "code changed" and build everything (fail-safe).
    env:
      RUN_BUILD: ${{ github.event_name != 'pull_request' || needs.path-filter.result != 'success' || needs.path-filter.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.jvm == 'java') }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        jvm: [ java, graalvm ]

    steps:
      - name: Skip build and test for docs-only PR
        if: env.RUN_BUILD != 'true'
        run: echo "Docs-only PR - skipping build and test (kept only for the SonarCloud analysis cell)"

      - name: Checkout sources
        if: env.RUN_BUILD == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build and test
        if: env.RUN_BUILD == 'true'
        uses: ./.github/actions/build
        with:
          jvm: ${{ matrix.jvm }}
          os: ${{ matrix.os }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SonarCloud analysis
        if: env.RUN_BUILD == 'true' && (matrix.os == 'ubuntu-latest' && matrix.jvm == 'java')
        run: >
          mvn --batch-mode -DskipTests sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=powsybl-ci-github
          -Dsonar.projectKey=com.powsybl:open-rao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  javadoc:
    name: Build Javadoc
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Javadoc with Maven
        run: mvn --batch-mode -Prelease -DskipTests -Dcheckstyle.skip package
