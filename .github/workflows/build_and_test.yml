name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches-ignore:
      - 'ci/**-**'

jobs:
  # Gate job: always runs and always succeeds, so it can be a required check even
  # when the build matrix below is skipped (skipped required checks would block the merge).
  # See .github/actions/code-change-gate for the shared gate logic (doc-path filter,
  # synthetic SonarCloud check on docs-only PRs, step summary).
  path-filter:
    name: Code change gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      checks: write
    outputs:
      code_changed: ${{ steps.gate.outputs.code_changed }}
    steps:
      # Required before referencing the local composite action (empty workspace otherwise).
      - name: Checkout sources
        uses: actions/checkout@v1
      - id: gate
        uses: ./.github/actions/code-change-gate

  build:
    name: Build and test on ${{ matrix.os }} with ${{ matrix.jvm }}
    runs-on: ${{ matrix.os }}
    needs: path-filter
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.fork == false &&
        needs.path-filter.outputs.code_changed == 'true'))
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        jvm: [ java, graalvm ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v1

      - name: Set up Java 21
        if: matrix.jvm == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup GraalVM
        if: matrix.jvm == 'graalvm'
        uses: graalvm/setup-graalvm@60c26726de13f8b90771df4bc1641a52a3159994 # v1.5.2
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Maven
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        run: mvn --batch-mode -Pjacoco install

      - name: Build with Maven
        if: matrix.os != 'ubuntu-latest' || matrix.jvm != 'java'
        run: mvn --batch-mode install

      - name: Run SonarCloud analysis
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        run: >
          mvn --batch-mode -DskipTests sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=powsybl-ci-github
          -Dsonar.projectKey=com.powsybl:open-rao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
