name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches-ignore:
      - 'ci/**-**'

jobs:
  path-filter:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/path-filter.yml

  build:
    needs: path-filter
    name: Build and test on ${{ matrix.os }} with ${{ matrix.jvm }}
    runs-on: ${{ matrix.os }}
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork == false)
    env:
      RUN_BUILD: ${{ github.event_name != 'pull_request' || needs.path-filter.outputs.code == 'true' }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        jvm: [ java, graalvm ]

    steps:
      - name: Skip build and test for docs-only PR
        if: env.RUN_BUILD != 'true'
        run: echo "Docs-only PR - skipping build and test"

      - name: Checkout sources
        if: env.RUN_BUILD == 'true'
        uses: actions/checkout@v1

      - name: Build and test
        if: env.RUN_BUILD == 'true'
        uses: ./.github/actions/build
        with:
          jvm: ${{ matrix.jvm }}
          os: ${{ matrix.os }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SonarCloud analysis
        if: env.RUN_BUILD == 'true' && (matrix.os == 'ubuntu-latest' && matrix.jvm == 'java')
        run: >
          mvn --batch-mode -DskipTests sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=powsybl-ci-github
          -Dsonar.projectKey=com.powsybl:open-rao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
