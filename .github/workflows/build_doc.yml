name: Documentation

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  path-filter:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/path-filter.yml

  doc_ubuntu:
    name: ⚙️ Build documentation on Ubuntu
    needs: path-filter
    if: always()
    runs-on: ubuntu-latest
    # Code-only PRs: skip the build, but keep the job running (no-op) so the required
    # check is still reported and the PR is not blocked. If path-filter FAILS, build anyway.
    env:
      RUN_BUILD: ${{ github.event_name != 'pull_request' || needs.path-filter.result != 'success' || needs.path-filter.outputs.docs == 'true' }}
    steps:
      - name: Skip doc build for code-only PR
        if: env.RUN_BUILD != 'true'
        run: echo "PR does not touch documentation - skipping doc build"

      - name: Checkout sources
        if: env.RUN_BUILD == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        if: env.RUN_BUILD == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12

      - name: Install Python dependencies
        if: env.RUN_BUILD == 'true'
        run: |
          pip install --only-binary :all: sphinx==9.1.0
          pip install --only-binary :all: sphinx-tabs==3.5.0
          pip install --only-binary :all: furo==2025.12.19
          pip install --only-binary :all: myst-parser==5.1.0
          pip install --only-binary :all: sphinxcontrib-mermaid==2.0.2
          pip install --only-binary :all: sphinx_copybutton==0.5.2

      - name: Build doc
        if: env.RUN_BUILD == 'true'
        run: sphinx-build -a docs ./build-docs

      - name: Check all links in the generated HTML
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # Checks every generated HTML page (local + external links); fails on any status outside
          # 2xx + 403 (the Slack workspace home page 403s headless clients) + 429 (transient rate
          # limiting by the target host — never a broken link; a real 404 still fails).
          # NOTE: lychee's -a flag REPLACES the default accepted list, so the 2xx range must be
          # spelled out explicitly (a CI run with only "-a 403" rejected every 200 link).
          # --cache=false: cache is disabled in CI because GitHub reuses runner VMs across runs and a
          # stale .lycheecache replayed cached failures from a previous run (verified on a CI run).
          # HTML only: Sphinx's _sources/*.md.txt dumps are covered by their HTML equivalent, and scanning the
          # raw sources would pick up bare URIs that are not links (XML namespace identifiers inside code blocks).
          args: --no-progress --cache=false -a 200..=299,403,429 './build-docs/**/*.html'
