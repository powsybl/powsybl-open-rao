name: Documentation

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  doc_ubuntu:
    name: ⚙️ Build documentation on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Python dependencies
        run: |
          pip install --only-binary :all: sphinx==9.1.0
          pip install --only-binary :all: sphinx-tabs==3.5.0
          pip install --only-binary :all: furo==2025.12.19
          pip install --only-binary :all: myst-parser==5.1.0
          pip install --only-binary :all: sphinxcontrib-mermaid==2.0.2
          pip install --only-binary :all: sphinx_copybutton==0.5.2

      - name: Build doc
        run: sphinx-build -a docs ./build-docs

      - name: Check all links in the generated HTML
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # Crawls every generated HTML page (local + external links); fails on any non-2xx status (no accepted codes).
          args: --no-progress ./build-docs
