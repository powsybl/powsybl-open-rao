name: CI on forks - build and tests

on:
  pull_request:

permissions: {}

jobs:
  path-filter:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/path-filter.yml

  build:
    needs: path-filter
    name: Build and test on ${{ matrix.os }} with ${{ matrix.jvm }}
    runs-on: ${{ matrix.os }}
    # always(): if the path-filter job fails, the build must still run (fail-safe), not be skipped
    if: always() && github.event.pull_request.head.repo.fork == true
    # Docs-only PRs: skip all build cells except ubuntu/java, which still runs so that the
    # artifacts for the "CI on forks - Sonar analysis" workflow are uploaded and the real
    # SonarCloud analysis can execute and report its result.
    # If the path-filter job FAILS, treat it as "code changed" and build everything (fail-safe).
    env:
      RUN_BUILD: ${{ needs.path-filter.result == 'failure' || needs.path-filter.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.jvm == 'java') }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        jvm: [ java, graalvm ]

    steps:
      - name: Skip build and test for docs-only PR
        if: env.RUN_BUILD != 'true'
        run: echo "Docs-only PR - skipping build and test (kept only for the SonarCloud analysis cell)"

      - name: Checkout sources
        if: env.RUN_BUILD == 'true'
        uses: actions/checkout@v1

      - name: Build and test
        if: env.RUN_BUILD == 'true'
        uses: ./.github/actions/build
        with:
          jvm: ${{ matrix.jvm }}
          os: ${{ matrix.os }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Fork-PR only: collect build data for the "CI on forks - Sonar analysis" workflow
      - name: Regroup dependencies in target folders
        if: env.RUN_BUILD == 'true' && (matrix.os == 'ubuntu-latest' && matrix.jvm == 'java')
        run: mvn --batch-mode dependency:copy-dependencies

      - name: Save classes and Jacoco report
        if: env.RUN_BUILD == 'true' && (matrix.os == 'ubuntu-latest' && matrix.jvm == 'java')
        uses: actions/upload-artifact@v4
        with:
          name: data-for-sonar-analysis-${{ github.event.pull_request.number }}
          retention-days: 1
          path: |
            */target/classes
            */*/target/classes
            */*/*/target/classes
            */*/*/*/target/classes
            */target/generated-sources
            */*/target/generated-sources
            */*/*/target/generated-sources
            */*/*/*/target/generated-sources
            distribution/target/dependency
            distribution/target/site/jacoco-aggregate/jacoco.xml

      - name: Save PR Information
        if: env.RUN_BUILD == 'true' && (matrix.os == 'ubuntu-latest' && matrix.jvm == 'java')
        env:
          REPO_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p pr-info
          echo "$REPO_NAME" > pr-info/repo-name
          echo "$HEAD_REF" > pr-info/head-ref
          echo "$HEAD_SHA" > pr-info/head-sha
          echo "$PR_NUMBER" > pr-info/pr-number
          echo "$BASE_REF" > pr-info/base-ref

      - name: Upload PR Information
        if: env.RUN_BUILD == 'true' && (matrix.os == 'ubuntu-latest' && matrix.jvm == 'java')
        uses: actions/upload-artifact@v4
        with:
          name: pr-info-${{ github.event.pull_request.number }}
          path: pr-info/
          retention-days: 1
