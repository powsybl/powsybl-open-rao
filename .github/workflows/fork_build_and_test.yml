name: CI on forks - build and tests

on:
  pull_request:

permissions: {}

jobs:
  build:
    name: Build and test on ${{ matrix.os }} with ${{ matrix.jvm }}
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.head.repo.fork == false
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-2022, macos-latest ]
        jvm: [ java, graalvm ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v1

      - name: Set up Java 21
        if: matrix.jvm == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'oracle'

      - name: Setup GraalVM
        if: matrix.jvm == 'graalvm'
        uses: graalvm/setup-graalvm@60c26726de13f8b90771df4bc1641a52a3159994 # v1.5.2
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Maven
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        run: mvn --batch-mode -Pjacoco install

      - name: Build with Maven
        if: matrix.os != 'ubuntu-latest' || matrix.jvm != 'java'
        run: mvn --batch-mode install

      # Fork-PR only: collect build data for the "CI on forks - Sonar analysis" workflow
      - name: Regroup dependencies in target folders
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        run: mvn --batch-mode dependency:copy-dependencies

      - name: Save classes and Jacoco report
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        uses: actions/upload-artifact@v4
        with:
          name: data-for-sonar-analysis-${{ github.event.pull_request.number }}
          retention-days: 1
          path: |
            */target/classes
            */*/target/classes
            */*/*/target/classes
            */*/*/*/target/classes
            */target/generated-sources
            */*/target/generated-sources
            */*/*/target/generated-sources
            */*/*/*/target/generated-sources
            distribution/target/dependency
            distribution/target/site/jacoco-aggregate/jacoco.xml

      - name: Save PR Information
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        env:
          REPO_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p pr-info
          echo "$REPO_NAME" > pr-info/repo-name
          echo "$HEAD_REF" > pr-info/head-ref
          echo "$HEAD_SHA" > pr-info/head-sha
          echo "$PR_NUMBER" > pr-info/pr-number
          echo "$BASE_REF" > pr-info/base-ref

      - name: Upload PR Information
        if: matrix.os == 'ubuntu-latest' && matrix.jvm == 'java'
        uses: actions/upload-artifact@v4
        with:
          name: pr-info-${{ github.event.pull_request.number }}
          path: pr-info/
          retention-days: 1
