name: Code change gate
description: >-
  Shared gate for the CI build workflows. Decides from the PR diff whether any
  file outside the doc paths is modified (code_changed output), so the build
  matrix can be skipped on docs-only PRs. The gate job always succeeds, so it
  can be a required check even when the build is skipped (a skipped required
  check would block the merge). On docs-only PRs from the main repo it also
  posts a synthetic successful "SonarCloud Code Analysis" check, because the
  real one (posted by the SonarCloud app) is only created when the scan step
  actually runs - otherwise the required SonarCloud check would stay pending.

outputs:
  code_changed:
    description: 'true when the PR modifies files outside the doc paths'
    value: ${{ steps.filter.outputs.code }}

runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          code:
            - '!docs/**'
            - '!README.md'
            - '!CONTRIBUTING.md'

    - name: Create SonarCloud check for docs-only PR
      if: steps.filter.outputs.code == 'false' && github.event.pull_request.head.repo.fork == false
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: |
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'SonarCloud Code Analysis',
            head_sha: context.payload.pull_request.head.sha,
            status: 'completed',
            conclusion: 'success',
            output: {
              title: 'Skipped: docs-only change',
              summary: 'No code changes detected in this PR, the SonarCloud analysis was not run.'
            }
          });

    - name: Explain decision
      shell: bash
      env:
        FILTER_RESULT: ${{ steps.filter.outputs.code }}
      run: |
        {
          echo "## Code change gate"
          echo "Full build required when any file outside the doc paths (docs/**, READMEs) changes."
          echo ""
          echo "\`code_changed: ${FILTER_RESULT}\`"
        } >> "$GITHUB_STEP_SUMMARY"
