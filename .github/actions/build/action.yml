name: Build and test with Maven
description: Set up the JVM and run the Maven build (shared by the CI workflows)
inputs:
  jvm:
    description: java or graalvm
    required: true
  os:
    description: runner OS label
    required: true
  github-token:
    description: token for graalvm setup
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java 21
      if: inputs.jvm == 'java'
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Setup GraalVM
      if: inputs.jvm == 'graalvm'
      uses: graalvm/setup-graalvm@60c26726de13f8b90771df4bc1641a52a3159994 # v1.5.2
      with:
        java-version: '21'
        distribution: 'graalvm'
        github-token: ${{ inputs.github-token }}

    - name: Build with Maven (with Jacoco)
      if: inputs.os == 'ubuntu-latest' && inputs.jvm == 'java'
      shell: bash
      run: mvn --batch-mode -Pjacoco install

    - name: Build with Maven
      if: inputs.os != 'ubuntu-latest' || inputs.jvm != 'java'
      shell: bash
      run: mvn --batch-mode install
